@layer base {
  *, ::after, ::before, ::backdrop, ::file-selector-button {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0 solid;
  }
  html, :host {
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
    tab-size: 4;
    font-family: var(--default-font-family, ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji");
    font-feature-settings: var(--default-font-feature-settings, normal);
    font-variation-settings: var(--default-font-variation-settings, normal);
    -webkit-tap-highlight-color: transparent;
  }
  hr {
    height: 0;
    color: inherit;
    border-top-width: 1px;
  }
  abbr:where([title]) {
    -webkit-text-decoration: underline dotted;
    text-decoration: underline dotted;
  }
  h1, h2, h3, h4, h5, h6 {
    font-size: inherit;
    font-weight: inherit;
  }
  a {
    color: inherit;
    -webkit-text-decoration: inherit;
    text-decoration: inherit;
  }
  b, strong {
    font-weight: bolder;
  }
  code, kbd, samp, pre {
    font-family: var(--default-mono-font-family, ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
    font-feature-settings: var(--default-mono-font-feature-settings, normal);

    font-size: 1em;
  }
  small {
    font-size: 80%;
  }
  sub, sup {
    font-size: 75%;
    line-height: 0;
    position: relative;
    vertical-align: baseline;
  }
  sub {
    bottom: -0.25em;
  }
  sup {
    top: -0.5em;
  }
  table {
    text-indent: 0;
    border-color: inherit;
    border-collapse: collapse;
  }
  :-moz-focusring {
    outline: auto;
  }
  progress {
    vertical-align: baseline;
  }
  summary {
    display: list-item;
  }
  ol, ul, menu {
    list-style: none;
  }
  img, svg, video, canvas, audio, iframe, embed, object {
    display: block;
    vertical-align: middle;
  }
  img, video {
    max-width: 100%;
    height: auto;
  }
  button, input, select, optgroup, textarea, ::file-selector-button {
    font: inherit;
    font-feature-settings: inherit;
    font-variation-settings: inherit;
    letter-spacing: inherit;
    color: inherit;
    border-radius: 0;
    background-color: transparent;
    opacity: 1;
  }
  :where(select:is([multiple], [size])) optgroup {
    font-weight: bolder;
  }
  :where(select:is([multiple], [size])) optgroup option {
    padding-inline-start: 20px;
  }
  ::file-selector-button {
    margin-inline-end: 4px;
  }
  ::placeholder {
    opacity: 1;
  }
  @supports (not (-webkit-appearance: -apple-pay-button))  or (contain-intrinsic-size: 1px) {
    ::placeholder {
      color: currentcolor;

      }

  }

    resize: vertical;
  }
  ::-webkit-search-decoration {
    -webkit-appearance: none;
  }

    min-height: 1lh;
    text-align: inherit;
  }
  ::-webkit-datetime-edit {
    display: inline-flex;
  }
  ::-webkit-datetime-edit-fields-wrapper {
    padding: 0;
  }
  ::-webkit-datetime-edit, ::-webkit-datetime-edit-year-field, ::-webkit-datetime-edit-month-field, ::-webkit-datetime-edit-day-field, ::-webkit-datetime-edit-hour-field, ::-webkit-datetime-edit-minute-field, ::-webkit-datetime-edit-second-field, ::-webkit-datetime-edit-millisecond-field, ::-webkit-datetime-edit-meridiem-field {
    padding-block: 0;
  }
  ::-webkit-calendar-picker-indicator {
    line-height: 1;
  }
  :-moz-ui-invalid {
    box-shadow: none;
  }
  button, input:where([type="button"], [type="reset"], [type="submit"]), ::file-selector-button {

:root {

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes slide-up {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes gold-pulse {
  0%, 100% {
    box-shadow: 0 0 10px rgba(245, 197, 24, 0.1);
  }
  50% {
    box-shadow: 0 0 25px rgba(245, 197, 24, 0.25);
  }
}
@keyframes gold-pulse-forte {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(240, 208, 48, 0.45), 0 0 16px 1px rgba(240, 208, 48, 0.30);
    background: linear-gradient(180deg, rgba(240, 208, 48, 0.20), rgba(240, 208, 48, 0.09));
  }
  50% {
    box-shadow: 0 0 0 9px rgba(240, 208, 48, 0), 0 0 34px 7px rgba(240, 208, 48, 0.70);
    background: linear-gradient(180deg, rgba(240, 208, 48, 0.38), rgba(240, 208, 48, 0.18));
  }
}
@keyframes slide-out-right {
  from {
    transform: translateX(0);
    opacity: 1;
  }
  to {
    transform: translateX(100vw);
    opacity: 0;
  }
}
@keyframes flight-pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.55;
  }
}
.animate-flight-pulse {
  animation: flight-pulse 2s ease-in-out infinite;
}
@keyframes scroll {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-50%);
  }
}
@keyframes heroArrow {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(8px);
  }
}
@keyframes subtlePulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.85;
  }
}
@keyframes radarSpin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}
@keyframes radarBlip {
  0%, 100% {
    opacity: 0.3;
  }
  50% {
    opacity: 1;
  }
}
@keyframes livePulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.3;
  }
}
@keyframes planeMove1 {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(-8px, 6px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes planeMove2 {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(10px, -4px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes planeMove3 {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(-6px, -10px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes planeMove4 {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(-10px, 5px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@keyframes planeMove5 {
  0% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(7px, 8px);
  }
  100% {
    transform: translate(0, 0);
  }
}
.radar-sweep {
  transform-origin: 120px 120px;
  animation: radarSpin 4s linear infinite;
}
.radar-live {
  animation: livePulse 2s ease-in-out infinite;
}
.radar-blip-1 {
  animation: radarBlip 2s ease-in-out infinite;
}
.radar-blip-2 {
  animation: radarBlip 2.4s ease-in-out infinite 0.5s;
}
.radar-blip-3 {
  animation: radarBlip 1.8s ease-in-out infinite 1.2s;
}
.radar-blip-4 {
  animation: radarBlip 2.6s ease-in-out infinite 0.8s;
}
.radar-blip-5 {
  animation: radarBlip 2.2s ease-in-out infinite 1.8s;
}
.radar-blip-6 {
  animation: radarBlip 3s ease-in-out infinite 0.3s;
}
.radar-blip-7 {
  animation: radarBlip 2s ease-in-out infinite 2.5s;
}
.radar-blip-8 {
  animation: radarBlip 2.8s ease-in-out infinite 0.9s;
}
.radar-move-1 {
  animation: planeMove1 20s linear infinite;
}
.radar-move-2 {
  animation: planeMove5 28s linear infinite;
}
.radar-move-3 {
  animation: planeMove3 18s linear infinite;
}
.radar-move-4 {
  animation: planeMove2 25s linear infinite;
}
.radar-move-5 {
  animation: planeMove4 22s linear infinite;
}
.radar-move-7 {
  animation: planeMove1 24s linear infinite;

@layer base {
  * {
    border-color: var(--border);
    outline-color: var(--ring);
    @supports (color: color-mix(in lab, red, red)) {
      outline-color: color-mix(in oklab, var(--ring) 50%, transparent);
    }
  }
  body {
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 0.3s ease, color 0.3s ease;
    background-color: var(--background);
    color: var(--foreground);
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  code, pre, kbd, samp, .font-mono {
    font-family: var(--font-mono);
  }
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: var(--color-hub-black-light);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--color-hub-gray-700);
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--color-hub-gray-500);
  }
  ::selection {
    background-color: rgba(245, 197, 24, 0.3);
    color: var(--color-hub-white);
  }
}

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .bg-gradient-gold {
    background: linear-gradient(135deg, #F0D030, #D4B828);
  }
  .bg-gradient-dark {
    background: linear-gradient(180deg, #000000, #111111);
  }
  .border-gold {
    border-color: rgba(245, 197, 24, 0.2);
  }
  .border-gold-strong {
    border-color: rgba(245, 197, 24, 0.5);
  }
  .glass-dark {
    background: rgba(26, 26, 26, 0.8);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .card-hub {
    background-color: var(--color-hub-black-card);
    border: 1px solid rgba(245, 197, 24, 0.08);
    border-radius: var(--radius-card);

    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }
  .card-hub:hover {
    box-shadow: var(--shadow-card-hover);
    border-color: rgba(245, 197, 24, 0.15);
  }
}
